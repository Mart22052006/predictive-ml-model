version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-backend: { patterns: ["*"] }

  - package-ecosystem: pip
    directory: /ml
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-ml: { patterns: ["*"] }

  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python-dev: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      frontend: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /ml
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
