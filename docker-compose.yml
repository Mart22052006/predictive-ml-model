x-env: &env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pdm}:${POSTGRES_PASSWORD:-pdm}@db:5432/${POSTGRES_DB:-pdm}
  SIMULATOR_WAIT_TIME: ${SIMULATOR_WAIT_TIME:-30}
  WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-30}
  RUL_WARNING: ${RUL_WARNING:-75}
  RUL_CRITICAL: ${RUL_CRITICAL:-30}
  RUL_CLIP: ${RUL_CLIP:-125}
  BOT_TOKEN: ${BOT_TOKEN:-}
  CHAT_ID: ${CHAT_ID:-}

x-app: &app
  image: pdm-app
  build: .
  environment: *env
  restart: on-failure
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdm}
      POSTGRES_DB: ${POSTGRES_DB:-pdm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: pdm-app
    build: .
    environment: *env
    working_dir: /app/backend
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  simulator:
    <<: *app
    working_dir: /app/ml
    command: python simulator.py ../data/train_FD001.txt

  worker:
    <<: *app
    working_dir: /app/ml
    command: python worker.py

  alert-sender:
    <<: *app
    working_dir: /app/backend
    command: python -m app.workers.alert_sender

  api:
    <<: *app
    working_dir: /app/backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    restart: on-failure
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
